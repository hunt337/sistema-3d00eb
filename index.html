<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<meta name="robots" content="noindex, nofollow">
<title>Система MM Ярый</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;700;800&display=swap">
<style>
:root{
  /* Layout: full-bleed canvas constellation of the system; glass caption card docks to the bottom on phones and to the left on wide screens; node details slide in as a sheet */
  --ink:#07051a;
  --glass:rgba(16,11,38,.80);
  --glass-2:rgba(30,22,66,.62);
  --line:rgba(176,150,255,.16);
  --line-2:rgba(176,150,255,.32);
  --fg:#f4f0ff;
  --soft:#ddd5ff;
  --muted:#b3a9d9;
  --dim:#7d74a6;
  --violet:#9d7bff;
  --magenta:#ff5ad9;
  --amber:#ffb547;
  --mint:#3eeaa8;
  --cyan:#4fe3ff;
  --coral:#ff6b7d;
  --rose:#ffd3ec;
  --on-accent:#14092a;
  --accent:var(--magenta);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#map.hover{cursor:pointer}

/* ---------- header + ticker ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);pointer-events:none;
  background:linear-gradient(180deg,rgba(7,5,26,.95) 0%,rgba(7,5,26,.75) 65%,rgba(7,5,26,0) 100%)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:800 14px/1 var(--f-display);letter-spacing:.08em;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 8px rgba(255,90,217,.65))}
.brand em{font:700 10px/1 var(--f-mono);font-style:normal;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line-2);border-radius:999px}
.mode{pointer-events:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);
  background:rgba(20,14,46,.72);font:600 13px/1 var(--f-body);color:var(--fg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mode svg{width:16px;height:16px}
.ticker{overflow:hidden;height:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex;width:max-content;animation:tick 70s linear infinite;font:700 11px/25px var(--f-mono);letter-spacing:.16em;color:#d9ceff;white-space:nowrap}
.ticker-track span{padding-right:0}
.ticker b{color:var(--magenta);font-weight:700;padding:0 14px}
.ticker i{font-style:normal;color:var(--dim);padding:0 8px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- caption card ---------- */
.card{position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:56vh;max-height:56dvh;display:flex;flex-direction:column;
  border-radius:24px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;touch-action:pan-y}
.card.off{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
.card-body{overflow-y:auto;padding:18px 20px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.card-body::-webkit-scrollbar{display:none}
.card-body>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card-body>*:nth-child(2){animation-delay:.05s}
.card-body>*:nth-child(3){animation-delay:.1s}
.card-body>*:nth-child(4){animation-delay:.15s}
.card-body>*:nth-child(5){animation-delay:.2s}
.card-body>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:8px;font:700 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.eyebrow span{white-space:nowrap}
.eyebrow span:last-of-type{overflow:hidden;text-overflow:ellipsis;min-width:0}
.eyebrow .n{color:var(--fg)}
.eyebrow .of{color:var(--dim)}
.eyebrow::after{content:"";flex:1;min-width:12px;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:12px 0 10px;color:var(--fg)}
h1{font-size:clamp(23px,6.4vw,34px);line-height:1.1}
h2{font-size:clamp(20px,5.4vw,28px);line-height:1.14}
.lead{color:var(--soft);margin:0 0 12px;max-width:60ch;font-size:15px}
.pts{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.pts li{position:relative;padding-left:22px;color:var(--muted);font-size:14px;line-height:1.45}
.pts li::before{content:"";position:absolute;left:2px;top:.36em;width:10px;height:11px;background:var(--accent);
  -webkit-clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.pts b{color:var(--fg);font-weight:600}
.kicker{margin:12px 0 6px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600;color:var(--fg);font-size:14px;line-height:1.45}
.hint{margin:10px 0 4px;font:700 10.5px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.stat{padding:11px 12px 10px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);min-width:0}
.stat b{display:block;font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap;
  text-shadow:0 0 18px color-mix(in srgb,var(--c) 75%,transparent)}
.stat span{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;line-height:1.3;color:var(--muted)}
.stat span::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 4px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:14px;height:14px;flex:none}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.ghost{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background .2s}
.ghost:hover{background:var(--glass-2)}
.ghost:disabled{opacity:.28;cursor:default}
.ghost svg{width:18px;height:18px}
.dots{flex:1;display:flex;justify-content:center;flex-wrap:wrap;min-width:0}
.dots button{padding:10px 2px;display:grid;place-items:center}
.dots button i{display:block;width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.2);transition:width .35s,background .35s}
.dots button[aria-current="step"] i{width:20px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.next{height:42px;padding:0 16px 0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;box-shadow:0 0 26px color-mix(in srgb,var(--accent) 50%,transparent);transition:transform .15s}
.next:active{transform:scale(.97)}
.next svg{width:16px;height:16px}
.again{margin-top:6px;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:13.5px}
.again svg{width:15px;height:15px}

/* ---------- day clock ---------- */
.clock{display:flex;align-items:center;gap:14px;margin:4px 0 8px}
.clock-time{font:800 38px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:0 0 24px rgba(79,227,255,.5);min-width:4.2ch}
.clock-meta{display:grid;gap:5px;font:700 10.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock-meta span:first-child{color:var(--cyan)}
.clock .ghost{margin-left:auto}
.tl{position:relative;height:44px;margin:2px 0 10px;cursor:pointer;touch-action:none}
.tl-track{position:absolute;left:0;right:0;top:6px;height:20px;border-radius:10px;border:1px solid var(--line);
  background:linear-gradient(90deg,#0a0720 0%,#130e33 20%,#2a1f66 50%,#130e33 80%,#0a0720 100%)}
.tl-tick{position:absolute;top:4px;width:2px;height:10px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c);margin-left:-1px}
.tl-head{position:absolute;top:0;width:3px;height:32px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px #fff,0 0 2px #fff;border-radius:3px}
.tl-hours{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--dim)}
.feed{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:7px;min-height:92px}
.feed li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.35;color:var(--muted);animation:rise .45s both}
.feed li:first-child{color:var(--fg)}
.feed time{flex:none;font:700 12px/1 var(--f-mono);color:var(--c);min-width:40px}
.note{margin:0;font-size:12.5px;color:var(--dim);line-height:1.45}

/* ---------- free mode bar ---------- */
.freebar{position:fixed;z-index:4;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);white-space:nowrap;max-width:calc(100% - 24px)}
.freebar[hidden]{display:none}
.freebar span{padding:0 8px 0 10px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.freebar button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:13px;flex:none}
.freebar .primary{background:var(--magenta);color:var(--on-accent);border-color:transparent}

/* ---------- node sheet ---------- */
.sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:74vh;max-height:74dvh;overflow:auto;--c:var(--violet);
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  border-radius:26px 26px 0 0;background:rgba(13,9,32,.95);border:1px solid var(--line-2);border-bottom:0;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transform:translateY(105%);visibility:hidden;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s;box-shadow:0 -24px 70px rgba(0,0,0,.55)}
.sheet.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:-8px auto 14px}
.sheet::after{content:"";position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 100% at 20% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.sheet-x{position:absolute;z-index:1;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;background:rgba(13,9,32,.6)}
.sheet-x svg{width:16px;height:16px}
.s-kind{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c);padding-right:44px}
.s-tag{padding:5px 9px;border:1px solid var(--c);border-radius:999px}
.sheet h3{position:relative;z-index:1;font:700 24px/1.15 var(--f-display);margin:12px 0 4px;padding-right:40px}
.s-sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.s-desc{margin:0 0 18px;font-size:15.5px;line-height:1.55;color:#ebe5ff;max-width:60ch}
.sheet dl{display:grid;gap:14px;margin:0}
.sheet dt{font:700 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.sheet dd{margin:0;font-size:14px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass-2);font-size:13px;line-height:1}
.chip:hover{border-color:var(--c)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.none{color:var(--dim)}

/* ---------- no-JS fallback ---------- */
.fallback{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 80% at 70% 10%,#2a1260 0%,#07051a 60%);text-align:center}
.fallback div{max-width:34ch}
.fallback h1{font-size:26px}
.fallback p{color:var(--soft)}

/* ---------- wide screens ---------- */
@media (min-width:820px) and (min-aspect-ratio:11/10){
  .card{left:max(24px,env(safe-area-inset-left,0px));right:auto;top:100px;bottom:auto;width:410px;max-height:calc(100vh - 124px);max-height:calc(100dvh - 124px)}
  .card-body{padding:26px 28px 12px}
  .nav{padding:12px 16px 16px}
  h1{font-size:34px}
  h2{font-size:28px}
  .lead{font-size:16px}
  .pts li{font-size:14.5px}
  .sheet{left:auto;right:24px;top:100px;bottom:auto;width:390px;max-height:calc(100vh - 124px);max-height:calc(100dvh - 124px);
    border-radius:24px;border-bottom:1px solid var(--line-2);transform:translateX(calc(100% + 48px))}
  .sheet::before{display:none}
}
@media (prefers-reduced-motion:reduce){
  .ticker-track,.card-body>*,.feed li{animation:none}
  .card,.sheet{transition:none}
}
</style>
</head>
<body>
<canvas id="map" aria-label="Анимированная карта системы MM Ярый: источники данных, роботы, результаты и люди"></canvas>

<header class="top">
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><polygon points="13,1.5 23,7.25 23,18.75 13,24.5 3,18.75 3,7.25" fill="none" stroke="#ff5ad9" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#ff5ad9"/></svg>
      <span>MM ЯРЫЙ</span><em>система</em>
    </div>
    <button class="mode" id="modeBtn" type="button"></button>
  </div>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
</header>

<section class="card" id="card" aria-live="polite">
  <div class="card-body" id="cardBody"></div>
  <nav class="nav" aria-label="Шаги презентации">
    <button class="ghost" id="prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="next" id="next" type="button"><span id="nextLabel">Дальше</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</section>

<div class="freebar" id="freebar" hidden>
  <span>Нажми на любой узел</span>
  <button type="button" id="fitBtn">Вся карта</button>
  <button type="button" id="tourBtn" class="primary">Тур</button>
</div>

<aside class="sheet" id="sheet" aria-hidden="true">
  <button class="sheet-x" id="sheetX" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="s-kind" id="sKind"></div>
  <h3 id="sName"></h3>
  <p class="s-sub" id="sSub"></p>
  <p class="s-desc" id="sDesc"></p>
  <dl>
    <div id="sWhenRow"><dt>Когда</dt><dd id="sWhen"></dd></div>
    <div><dt>Берёт из</dt><dd class="chips" id="sIn"></dd></div>
    <div><dt>Отдаёт в</dt><dd class="chips" id="sOut"></dd></div>
  </dl>
</aside>

<div class="fallback" id="fallback">
  <div>
    <h1>Система MM Ярый</h1>
    <p>Здесь анимированная карта: кто что делает в нашей системе. Этот просмотрщик не запускает анимацию — открой файл в Safari или Chrome.</p>
  </div>
</div>

<script>
(function () {
'use strict';
document.getElementById('fallback').remove();

/* =========================================================
   DATA — кто что делает. Расписание — реальные таймеры (МСК).
   ========================================================= */
const KIND = {
  src:    { c: '#ffb547', name: 'Источник данных' },
  hub:    { c: '#ff5ad9', name: 'Сердце системы' },
  bot:    { c: '#9d7bff', name: 'Робот' },
  ai:     { c: '#4fe3ff', name: 'Робот с ИИ' },
  guard:  { c: '#ff6b7d', name: 'Охрана' },
  out:    { c: '#3eeaa8', name: 'Результат' },
  person: { c: '#ffd3ec', name: 'Люди' },
};
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
for (const k in KIND) KIND[k].rgb = hexRgb(KIND[k].c);
const rgba = (r, a) => 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + a + ')';

const ICON_SRC = {
  bag: 'M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z M9 8V6.5a3 3 0 0 1 6 0V8',
  bank: 'M3 9.5L12 4l9 5.5 M5 10.5v7 M9.5 10.5v7 M14.5 10.5v7 M19 10.5v7 M3 20h18',
  chat: 'M4 5.5h16v10.5H10l-4.5 3.5V16H4z M8 9.5h8 M8 12.5h5',
  coins: 'M12 4c3.9 0 7 1.3 7 3s-3.1 3-7 3-7-1.3-7-3 3.1-3 7-3z M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7 M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5',
  book: 'M5 4.5h11a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z M5 18a2 2 0 0 1 2-2h11 M9 8.5h5',
  cycle: 'M19.5 12a7.5 7.5 0 0 1-12.9 5.2 M4.5 12a7.5 7.5 0 0 1 12.9-5.2 M17.5 3.5v3.3h-3.3 M6.5 20.5v-3.3h3.3',

function fire(n, big) {

  if (n.rings.length > 4) n.rings.shift();

}
function stepGuard(dt) {

}
function stepDay(dt) {

  const a = Math.floor(wrapped ? 0 : prevM) + 1, b = Math.floor(simMin);
  for (let m = (wrapped ? 0 : a); m <= b; m++) {

    DAILY.forEach(ev => {

    });

  if (c) {

    $('tlHead').style.left = (simMin / 1440 * 100) + '%';
  }

  // glow
  ctx.globalCompositeOperation = 'lighter';
  const gs = n.r * (n.shape === 'sq' ? 4.2 : 4.6) * (1 + F * .35 + hv * .15);
  ctx.globalAlpha = Math.min(1, (.12 + .45 * L) + F * .55 + hv * .2);
  ctx.drawImage(GLOW[n.k], n.x - gs / 2, n.y - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over';
  // pulse rings
  n.rings = n.rings.filter(p => time - p.t < (p.big ? 1.6 : 1.1));
  n.rings.forEach(p => {
    const k = (time - p.t) / (p.big ? 1.6 : 1.1);
    ctx.globalAlpha = (1 - k) * (p.big ? .9 : .55) * A;
    ctx.strokeStyle = rgba(c, 1); ctx.lineWidth = (p.big ? 3 : 2) / Math.max(s, .35);
    ctx.beginPath();
    const rad = n.r * (1.1 + k * (p.big ? 1.8 : 1.1));
    if (n.shape === 'hex' || n.shape === 'hub') ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);
    else rr(n.x - rad, n.y - rad, rad * 2, rad * 2, rad * .35);
    ctx.stroke();
  });
  ctx.globalAlpha = A;
  if (n.shape === 'hex') {
    // orbit dots
    ctx.setLineDash([1.5, 8]); ctx.lineDashOffset = -time * 14;
    ctx.strokeStyle = rgba(c, .55 * L + .1); ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 1.42, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    const g = ctx.createRadialGradient(n.x, n.y - n.r * .3, 0, n.x, n.y, n.r);
    g.addColorStop(0, rgba(c, .32 + F * .3)); g.addColorStop(1, 'rgba(13,8,32,.96)');
    hexPath(n.x, n.y, n.r); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = rgba(c, .95); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
    hexPath(n.x, n.y, n.r * .8); ctx.strokeStyle = rgba(c, .22); ctx.lineWidth = 1.5; ctx.stroke();
    icon(n.ic, n.x, n.y, n.r * .95, rgba([255, 255, 255], .95), 1.9);
  } else if (n.shape === 'sq') {
    const sz = n.r * 1.8, x = n.x - sz / 2, y = n.y - sz / 2;
    ctx.setLineDash([1.5, 8]); ctx.lineDashOffset = time * 10;
    ctx.strokeStyle = rgba(c, .4 * L + .08); ctx.lineWidth = 2; ctx.lineCap = 'round';
    rr(x - 12, y - 12, sz + 24, sz + 24, 22); ctx.stroke(); ctx.setLineDash([]);
    const g = ctx.createLinearGradient(x, y, x, y + sz);
    g.addColorStop(0, rgba(c.map(v => Math.min(255, v + 40)), 1)); g.addColorStop(1, rgba(c.map(v => v * .55), 1));
    rr(x, y, sz, sz, 18); ctx.fillStyle = g; ctx.fill();
    ctx.save(); rr(x, y, sz, sz, 18); ctx.clip();
    const hl = ctx.createLinearGradient(x, y, x, y + sz * .5); hl.addColorStop(0, 'rgba(255,255,255,.35)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl; ctx.fillRect(x, y, sz, sz * .5); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; rr(x, y, sz, sz, 18); ctx.stroke();
    icon(n.ic, n.x, n.y + 1, n.r * 1.05, 'rgba(20,9,42,.92)', 2.1);
  } else if (n.shape === 'ci') {
    ctx.setLineDash([1.5, 8]); ctx.lineDashOffset = -time * 10;
    ctx.strokeStyle = rgba(c, .45 * L + .08); ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 1.4, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    const g = ctx.createRadialGradient(n.x, n.y - n.r * .4, 0, n.x, n.y, n.r);
    g.addColorStop(0, rgba(c, .3)); g.addColorStop(1, 'rgba(26,14,44,.96)');
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = rgba(c, .95); ctx.lineWidth = 3; ctx.stroke();
    if (n.ch) { ctx.font = '700 30px ' + FONT_D; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = rgba(c, 1); ctx.fillText(n.ch, n.x, n.y + 2); }
    else icon(n.ic, n.x, n.y, n.r * 1.05, rgba(c, 1), 1.9);
  }
  // tag + labels
  const ta = clamp01((15 * s - 5.5) / 3) * A;
  // the fuse's STOP plate takes the place of its usual tag, so it never climbs onto the cluster caption
  const tagY = n.y - n.r - (n.shape === 'hex' ? 30 : 34);
  const stopA = (n.id === 'fuse' && n.stop && time - n.stop < 1.6 && !free && SCENES[scene].key === 'guard')
    ? clamp01(Math.min((time - n.stop) * 8, (1.6 - (time - n.stop)) * 3)) : 0;
  if (n.tag) drawTag(n, n.tag, tagY, c, ta * (1 - stopA));
  if (stopA > 0) drawTag(n, 'СТОП: ДАННЫХ НА 40 % МЕНЬШЕ', tagY, KIND.guard.rgb, stopA);
  drawLabels(n, n.y + n.r + (n.shape === 'hex' ? 46 : 42), A);
  ctx.globalAlpha = 1;
}

function drawHub(n) {
  const c = KIND.hub.rgb, s = cam.s, L = n.lit, A = .35 + .65 * L, F = n.flash;
  ctx.globalCompositeOperation = 'lighter';
  const gs = 520 * (1 + F * .15);
  ctx.globalAlpha = .35 + .4 * L; ctx.drawImage(GLOW.hub, n.x - gs / 2, n.y - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = A;
  // satellites ring
  const SR = 132, rot = time * .12;
  ctx.strokeStyle = rgba(c, .25); ctx.lineWidth = 1.5; ctx.setLineDash([2, 7]); ctx.lineDashOffset = time * 8;
  ctx.beginPath(); ctx.arc(n.x, n.y, SR, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  for (let i = 0; i < 7; i++) {
    const a = rot + i / 7 * Math.PI * 2 - Math.PI / 2, x = n.x + SR * Math.cos(a), y = n.y + SR * Math.sin(a);
    const act = i === hubIdx, k = act ? Math.max(0, 1 - (time - hubBeam) / 1.1) : 0;
    if (act && k > 0) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k * A;
      const g = ctx.createLinearGradient(n.x, n.y, x, y); g.addColorStop(0, rgba(c, 0)); g.addColorStop(1, rgba(c, .9));
      ctx.strokeStyle = g; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(x, y); ctx.stroke();
      ctx.drawImage(GLOW.hub, x - 60, y - 60, 120, 120);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = A;
    }
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fillStyle = act && k > 0 ? rgba(c, .35 + .65 * k) : 'rgba(18,10,40,.95)'; ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '700 14px ' + FONT_M; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = act && k > .3 ? '#14092a' : rgba(c, 1); ctx.fillText(String(i + 1), x, y + 1);
  }
  // text ring
  const TR = 92, str = 'ДИСПЕТЧЕР ◆ ОБХОД КАЖДУЮ МИНУТУ ◆ 7 МАГАЗИНОВ ◆ БЕЗ ВЫХОДНЫХ ◆ ', ch = [...str];
  ctx.font = '700 12px ' + FONT_M; ctx.fillStyle = rgba(c, .9); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const r0 = -time * .18;
  ch.forEach((t, i) => {
    const a = r0 + i / ch.length * Math.PI * 2;
    ctx.save(); ctx.translate(n.x + TR * Math.cos(a), n.y + TR * Math.sin(a)); ctx.rotate(a + Math.PI / 2); ctx.fillText(t, 0, 0); ctx.restore();
  });
  // core
  const g = ctx.createRadialGradient(n.x, n.y - 20, 0, n.x, n.y, n.r);
  g.addColorStop(0, rgba(c, .55 + F * .3)); g.addColorStop(.6, rgba(c.map(v => v * .35), 1)); g.addColorStop(1, 'rgba(24,8,40,1)');
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = rgba(c, 1); ctx.lineWidth = 3.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 9, -time * 1.4, -time * 1.4 + Math.PI * .6); ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 9, -time * 1.4 + Math.PI, -time * 1.4 + Math.PI * 1.6); ctx.stroke();
  ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(time * .9); icon('cycle', 0, 0, 58, '#ffffff', 2.2); ctx.restore();
  // rings
  n.rings = n.rings.filter(p => time - p.t < 1.2);
  n.rings.forEach(p => { const k = (time - p.t) / 1.2; ctx.globalAlpha = (1 - k) * .7 * A; ctx.strokeStyle = rgba(c, 1); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * (1 + k * .9), 0, Math.PI * 2); ctx.stroke(); });
  ctx.globalAlpha = A;
  drawTag(n, n.tag, n.y - SR - 40, c, clamp01((15 * s - 5.5) / 3) * A);
  drawLabels(n, n.y + SR + 52, A);
  ctx.globalAlpha = 1;
}

function vignette() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .8);
  g.addColorStop(0, 'rgba(4,2,14,0)'); g.addColorStop(1, 'rgba(4,2,14,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   LOOP
   ========================================================= */
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  const sc = SCENES[scene], isDay = !free && sc.key === 'day';
  // camera
  if (followMode === 'fly') { const t = flyTarget(); tgt.x = t.x; tgt.y = t.y; tgt.s = t.s; }
  const k = RM ? 1 : 1 - Math.exp(-dt * 3.2);
  cam.x += (tgt.x - cam.x) * k; cam.y += (tgt.y - cam.y) * k;
  cam.s = Math.exp(Math.log(cam.s) + (Math.log(tgt.s) - Math.log(cam.s)) * k);
  // lit easing, flashes, ambient activity
  const kl = 1 - Math.exp(-dt * 4);
  NODES.forEach(n => {
    n.lit += (n.litT - n.lit) * kl;
    n.hover = (n.hover || 0) + ((n.hoverT || 0) - (n.hover || 0)) * kl;
    n.flash *= Math.exp(-dt * 2.4);
    if (isDay) {
      const f = FREQ[n.id]; if (f && Math.random() < dt / Math.max(.35, f * .12)) fire(n, false);
    } else if (n.rate && n.lit > .6 && !RM && Math.random() < n.rate * dt) fire(n, false);
  });
  edges.forEach(e => { e.lit += (e.litT - e.lit) * kl; });
  // hub cycle
  hubTimer += dt;
  const hubStep = isDay ? .3 : 1.05;
  if (hubTimer > hubStep) { hubTimer = 0; hubIdx = (hubIdx + 1) % 7; hubBeam = time; fire(byId.dispatch, false); }
  if (!free && sc.key === 'guard') stepGuard(dt);
  if (isDay) stepDay(dt);

  drawBackground();
  ctx.setTransform(DPR * cam.s, 0, 0, DPR * cam.s, DPR * (R.cx - cam.x * cam.s), DPR * (R.cy - cam.y * cam.s));
  drawDecor();
  drawEdges();
  drawParticles(dt);
  NODES.forEach(n => n.shape === 'hub' ? drawHub(n) : drawNode(n));
  vignette();
  requestAnimationFrame(frame);
}

/* =========================================================
   BOOT
   ========================================================= */
updateModeBtn();
measure();
applyScene(0, true);
requestAnimationFrame(t => { last = t; rect(); sceneCam(true); requestAnimationFrame(frame); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { rect(); sceneCam(false); });
})();
</script>
</body>
